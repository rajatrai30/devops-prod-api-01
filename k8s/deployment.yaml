apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-prod-api-app
  labels:
    app: devops-prod-api-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-prod-api-app
  template:
    metadata:
      labels:
        app: devops-prod-api-app
    spec:
      containers:
        - name: devops-prod-api-app
          image: rajatrai30/devops-prod-api-app-dev:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
